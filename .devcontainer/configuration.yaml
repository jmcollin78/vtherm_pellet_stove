# Configuration Home Assistant pour le dev container vtherm_pellet_stove
#
# Ce fichier simule un environnement HA minimal comprenant :
# - Un faux poêle à pellets (generic_thermostat + input_boolean)
# - Des capteurs de température simulés (input_number)
# - L'intégration versatile_thermostat en mode over_switch ciblant le faux poêle

# default_config intentionnellement absent (pull go2rtc qui nécessite Docker).
config:
history:
logbook:
homeassistant:
system_health:
energy:

recorder:
    auto_purge: true
    purge_keep_days: 1
    commit_interval: 5
    include:
        domains:
            - input_boolean
            - input_number
            - input_select
            - switch
            - climate
            - sensor
            - binary_sensor
            - number
            - select
            - versatile_thermostat
            - vtherm_pellet_stove

logger:
    default: warning
    logs:
        custom_components.versatile_thermostat: debug
        custom_components.vtherm_pellet_stove: debug

# Activer le débogueur Python (décommenter wait: true pour breakpoints)
debugpy:
    start: true
    wait: false
    port: 5678

versatile_thermostat:
    auto_regulation_expert:
        kp: 0.4
        ki: 0.08
        k_ext: 0.0
        offset_max: 5
        accumulated_error_threshold: 50
    short_ema_params:
        max_alpha: 0.6
        halflife_sec: 301
        precision: 3
    safety_mode:
        check_outdoor_sensor: false
    log_buffer_max_age_hours: 1

# ---------------------------------------------------------------------------
# Capteurs simulés
# ---------------------------------------------------------------------------

input_number:
    fake_room_temperature:
        name: Température pièce
        min: 0
        max: 35
        step: 0.1
        icon: mdi:thermometer
        unit_of_measurement: "°C"
        mode: box

    fake_outdoor_temperature:
        name: Température extérieure
        min: -20
        max: 40
        step: 0.1
        icon: mdi:home-thermometer
        unit_of_measurement: "°C"
        mode: box

    fake_current_power:
        name: Puissance actuelle
        min: 0
        max: 1000
        step: 10
        icon: mdi:flash
        unit_of_measurement: kW

    fake_current_power_max:
        name: Puissance max
        min: 0
        max: 1000
        step: 10
        icon: mdi:flash
        unit_of_measurement: kW

input_boolean:
    # Simule un switch ON/OFF pour le faux poêle (requis par generic_thermostat)
    fake_pellet_stove_switch:
        name: Poêle à pellets (switch)
        icon: mdi:fire

    fake_window_sensor:
        name: Fenêtre
        icon: mdi:window-open-variant

    fake_presence_sensor:
        name: Présence
        icon: mdi:home

# ---------------------------------------------------------------------------
# Faux poêle à pellets modélisé comme un generic_thermostat
# Expose : hvac_modes=[off, heat], fan_modes=[1,2,3,4,5]
# Note: generic_thermostat ne supporte pas fan_modes nativement.
# Pour des tests réels, remplacer par une intégration Duepi_EVO / ESPHome.
# ---------------------------------------------------------------------------

climate:
    - platform: generic_thermostat
      name: Poele Pellets Fake
      heater: input_boolean.fake_pellet_stove_switch
      target_sensor: input_number.fake_room_temperature
      ac_mode: false
      min_temp: 15
      max_temp: 30
