schema: spec-driven

context: |
    Language: French
    All artifacts must be written in French.
    Keep OpenSpec structural headings and SHALL/MUST keywords in English.
    Projet : plugin Home Assistant vtherm_pellet_stove pour Versatile Thermostat.
    Reference : release 1.0.1, commit f6b62c10d45903f6fa3164990a790f47c7ba48db.
    Les specs de reference decrivent le code, les tests et la documentation de cette release.
    Distinguer les exigences etayees, les observations, les anomalies et les inconnues.
    Les developpements #9/#12 restent suspendus : aucune reprise implicite de l'ancienne branche.
    Ne modifier ni le code de regulation ni le simulateur pour etablir cette reference.
    Aucun essai logiciel ne prouve l'arret physique d'un poele ni la surete materielle.
githubCopilot:
    cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
